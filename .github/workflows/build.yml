name: Build Jarvis APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download offline wake-word model (Vosk, Indian English)
        run: |
          curl -fsSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model
          mv vosk-model-small-en-in-0.4 app/src/main/assets/model
          uuidgen > app/src/main/assets/model/uuid

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jarvis (latest build)
          body: "Download Jarvis.apk below and install it on your Android phone."
          files: Jarvis.apk
          make_latest: true
